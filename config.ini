[settings]
excel_path = stores.xlsx
shopify_signup_url = https://accounts.shopify.com/signup
imap_server = outlook.office365.com
min_wait = 1.5
max_wait = 3.0
; 注册完成后是否关闭 AdsPower 窗口（建议先保持打开，方便你继续设置店铺）
close_browser_after = false
; 读不到验证码邮件时，在终端暂停，由你在浏览器里手动完成
manual_verify_fallback = true

[setup]
; 注册成功后自动填写店铺资料、退货规则、书面政策（不做主题）
run_after_register = true

[adspower]
; AdsPower 客户端：设置 -> 本地 API，确认地址和端口
api_base = http://127.0.0.1:50325
; 未开启 API Key 校验可留空
api_key =
; 启动时是否恢复上次标签页：0 否，1 是
open_tabs = 0
